<html>
<head>
  <meta charset="utf-8">
  <title>Muktoverse</title>
  <meta name="description" content="An interactive portfolio website of Dewan Mukto, powered by AFrame.IO and WebVR. Explore in 3D!" />
  <meta name="keywords" content="muktoverse, muktonet, mukto.net, the muktoverse, dewan mukto, dewan mukto co, #muktoverse, #dewanmuktoco, mukto verse, mukto net">
  <meta name="author" content="Dewan Mukto">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">

  <!-- AFRAme & components -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.slim.js"></script>
  <script src="https://unpkg.com/networked-aframe@^0.7.1/dist/networked-aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-randomizer-components@^3.0.1/dist/aframe-randomizer-components.min.js"></script>
  <script src="https://unpkg.com/aframe-particle-system-component@1.0.5/dist/aframe-particle-system-component.min.js"></script>
  <script src="/js/spawn-in-circle.component.js"></script>
  <script src="https://unpkg.com/aframe-text-geometry-component@^0.5.0/dist/aframe-text-geometry-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body>
<a-scene physics="gravity: -9.8" networked-scene="room: basic;debug: true;" vr-mode-ui="enabled: false" loading-screen="enabled: true;">

  <!-- ASSETS -->
  <a-assets>
    <img id="groundTexture" src="assets/laminate_floor_03_diff_1k.png" />
    <img id="skyTexture" src="assets/abandoned_hall_01_4k.png" />
    <img id="skyTexture0" src="assets/brown_photostudio_05_4k.png" />
    <img id="skyTexture1" src="assets/aft_lounge_4k.png" />
    <img id="skyTexture2" src="assets/blouberg_sunrise_2_4k.png" />
    <img id="boxTexture" src="https://i.seadn.io/gae/A-GaHQdmGnbtnI-Znls_8WZm6FXrKUX7eDr2bhCfT3lqJ_N17n4uGV4WESnz1TcfxEFmm6Et-FK15QXT4a8l5buKn2IkYZbjMxjkjuA?auto=format&w=1920" />
    <img id="muktoLogo" src="https://dm.mux8.com/asset/logos/logo.png" />
    <img id="muktosplash" src="assets/dmc_banner_tp.png" />

    <!-- avatar template -->
    <template id="avatar-template">
      <a-entity class="avatar">
        <a-box class="head" color="#5985ff" scale="0.45 0.5 0.4" src="#boxTexture" random-color></a-box>
        <a-entity class="face" position="0 0.05 0">
          <a-sphere class="eye" color="#efefef" position="0.12 0.02 -0.15" scale="0.1 0.1 0.1">
            <a-sphere class="pupil" color="#000" position="0 0 -1" scale="0.2 0.2 0.2"></a-sphere>
          </a-sphere>
          <a-sphere class="eye" color="#efefef" position="-0.12 0.02 -0.15" scale="0.1 0.1 0.1">
            <a-sphere class="pupil" color="#000" position="0 0 -1" scale="0.2 0.2 0.2"></a-sphere>
          </a-sphere>
        </a-entity>
      </a-entity>
    </template>
  </a-assets>

  <!-- PLAYER -->
  <a-entity id="player" camera networked="template:#avatar-template;attachTemplateToLocal:false;" position="0 1.6 0"
            spawn-in-circle="radius:2" wasd-controls look-controls kinematic-body>
    <a-sphere class="head" visible="false" random-color></a-sphere>
  </a-entity>

  <!-- GALLERY LAYOUT -->
  <a-entity id="gallery"></a-entity>

  <script>
    const galleryImages = [
      {src:"assets/original-3743ff23b01ec3c79d77c427ef685987.png", pos:[-4,4,-5], rot:[0,45,0], url:"https://behance.net/dmkto"},
      {src:"https://cdn.dribbble.com/userupload/10753052/file/original-882c377e90e8711075bf0a29928ff2a0.png", pos:[0,5,-15], rot:[0,0,0], url:""},
      {src:"assets/original-f3047bd2e40cc447074695b1b6bf880d.png", pos:[4,4,-5], rot:[0,-45,0], url:"https://dribbble.com/dmkto"},
      {src:"assets/original-901f295283dbfd83577cc91fccaf650a.jpg", pos:[15,5,0], rot:[0,-90,0], url:""},
      {src:"assets/original-aea20384f5940ce206474c3b63a5bacd.png", pos:[4,4,5], rot:[0,-135,0], url:""},
      {src:"assets/4135123a679bb5150e9d6334d27505ce.png", pos:[0,5,15], rot:[0,180,0], url:""},
      {src:"assets/original-c76478d833017f6d0c52568f53c13407.png", pos:[-4,4,5], rot:[0,135,0], url:""},
      {src:"assets/2f87efc0141aea0b41250f876f2d128b.png", pos:[-15,5,0], rot:[0,90,0], url:""}
    ];
    const gallery = document.querySelector('#gallery');
    galleryImages.forEach(img=>{
      const aimg = document.createElement('a-image');
      aimg.setAttribute('src', img.src);
      aimg.setAttribute('position', img.pos.join(' '));
      aimg.setAttribute('rotation', img.rot.join(' '));
      aimg.setAttribute('height',6);
      aimg.setAttribute('width',8);
      if(img.url) aimg.setAttribute('onclick', `window.open('${img.url}')`);
      gallery.appendChild(aimg);
    });
  </script>

  <!-- HOLODISC -->
  <a-entity id="holodisc" position="0 1.6 -3">
    <a-entity id="textRing"></a-entity>
    <a-image src="https://dm.mux8.com/asset/logos/logo.png" width="1" height="1"
             position="0 0 0"
             material="transparent:true; opacity:0.9; emissive:#00ffff; emissiveIntensity:1.3;"
             animation="property: position; dir: alternate; dur: 4000; loop: true; to: 0 0.05 0">
    </a-image>
    <a-light type="point" color="#00ffff" intensity="2" distance="6" position="0 0 2"></a-light>
    <script>
      const phrase = "• Dewan Mukto • Muktoverse ";
      const text = phrase.repeat(2);
      const ring = document.querySelector('#textRing');
      const radius = 0.7;
      const angleStep = 360 / text.length;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const angle = i * angleStep;
        const rad = angle * Math.PI / 180;
        const x = Math.sin(rad) * radius;
        const z = Math.cos(rad) * radius;
        const letter = document.createElement('a-text');
        letter.setAttribute('value', ch);
        letter.setAttribute('color', '#00ffff');
        letter.setAttribute('align', 'center');
        letter.setAttribute('position', `${x} 0 ${z}`);
        letter.setAttribute('rotation', `0 ${angle} 0`);
        letter.setAttribute('scale', '0.6 0.6 0.6');
        letter.setAttribute('shader', 'msdf');
        letter.setAttribute('font', 'https://cdn.aframe.io/fonts/Roboto-msdf.json');
        letter.setAttribute('opacity', '0.85');
        letter.setAttribute('side', 'double');
        ring.appendChild(letter);
      }
      ring.setAttribute('animation',{property:'rotation',to:'0 360 0',loop:true,dur:30000,easing:'linear'});
    </script>
  </a-entity>

  <!-- MUKTO CUBE -->
  <a-box position="-1 10 -3" rotation="0 45 0" color="#ff0a45" src="#boxTexture"
         animation__mouseenter="property: scale; to: 5.3 5.3 5.3; dur: 300; startEvents: mouseenter"
         animation__mouseleave="property: scale; to: 1 1 1; dur: 300; startEvents: mouseleave"></a-box>

  <!-- SCENE BASE & SKY -->
  <a-cylinder id="ground" src="#groundTexture" radius="100" height="0.1" static-body></a-cylinder>
  <a-sky id="background" src="#skyTexture" radius="100"></a-sky>
  <a-sky src="#skyTexture0" radius="200"></a-sky>
  <a-sky src="#skyTexture1" radius="500"></a-sky>
  <a-sky src="#skyTexture2" radius="1000"></a-sky>
  <a-sky color="#00aabb" radius="2000"></a-sky>

  <!-- CAMERA & CURSOR -->
  <a-camera id="camera" look-controls="pointerLockEnabled: true">
    <a-cursor hover-color="#FAFAFA" active-color="#FF0000" color="#00ffff"></a-cursor>
  </a-camera>

  <!-- PARTICLES & LIGHT -->
  <a-entity id="particles" particle-system="preset: snow"></a-entity>
  <a-entity light="type: ambient; intensity: 0.5;"></a-entity>

  <!-- JUMP SCRIPT -->
  <script>
    const player = document.querySelector('#player');
    window.addEventListener('keydown', e=>{
      if(e.code === "Space"){
        const body = player.body || player.getAttribute('body');
        if(body){
          // apply upward velocity for jump
          body.velocity = body.velocity || {x:0, y:0, z:0};
          body.velocity.y = 5;
        } else {
          const pos = player.getAttribute('position');
          player.setAttribute('position', {x: pos.x, y: pos.y+1, z: pos.z});
        }
      }
    });
  </script>
</a-scene>
</body>
</html>
