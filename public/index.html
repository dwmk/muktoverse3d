<html>
<head>
  <meta charset="utf-8">
  <title>Muktoverse - Portfolio of Dewan Mukto</title>
  <meta name="description" content="An interactive portfolio website of Dewan Mukto, powered by AFrame.IO and WebVR. Explore in 3D!" />
  <meta name="keywords" content="muktoverse, muktonet, mukto.net, the muktoverse, dewan mukto, dewan mukto co, #muktoverse, #dewanmuktoco, mukto verse, mukto net">
  <meta name="author" content="Dewan Mukto">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">

  <!-- AFRAme & components -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
</head>
<body>
<a-scene physics="gravity: -9.8" vr-mode-ui="enabled: false">

  <!-- ASSETS -->
  <a-assets>
    <img id="groundTexture" src="assets/laminate_floor_03_diff_1k.png" />
    <img id="skyTexture" src="assets/abandoned_hall_01_4k.png" />
    <img id="skyTexture0" src="assets/brown_photostudio_05_4k.png" />
    <img id="skyTexture1" src="assets/aft_lounge_4k.png" />
    <img id="skyTexture2" src="assets/blouberg_sunrise_2_4k.png" />
    <img id="boxTexture" src="https://i.seadn.io/gae/A-GaHQdmGnbtnI-Znls_8WZm6FXrKUX7eDr2bhCfT3lqJ_N17n4uGV4WESnz1TcfxEFmm6Et-FK15QXT4a8l5buKn2IkYZbjMxjkjuA?auto=format&w=1920" />
    <img id="muktoLogo" src="https://dewanmukto.github.io/asset/logos/logo.png" />
  </a-assets>

  <!-- PLAYER -->
  <a-entity id="player" camera wasd-controls look-controls kinematic-body
            position="0 1.6 0" jump-controls>
  </a-entity>

  <!-- HOLODISC -->
  <a-entity id="holodisc" position="0 1.6 -3">
    <a-entity id="textRing"></a-entity>
    <a-image src="https://dm.mux8.com/asset/logos/logo.png" width="1" height="1"
             position="0 0 0"
             material="transparent:true; opacity:0.9; emissive:#00ffff; emissiveIntensity:1.3;"
             animation="property: position; dir: alternate; dur: 4000; loop: true; to: 0 0.05 0">
    </a-image>
    <a-light type="point" color="#00ffff" intensity="2" distance="6" position="0 0 2"></a-light>
    <script>
      const phrase = "• Dewan Mukto • Muktoverse ";
      const text = phrase.repeat(2);
      const ring = document.querySelector('#textRing');
      const radius = 0.7;
      const angleStep = 360 / text.length;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const angle = i * angleStep;
        const rad = angle * Math.PI / 180;
        const x = Math.sin(rad) * radius;
        const z = Math.cos(rad) * radius;
        const letter = document.createElement('a-text');
        letter.setAttribute('value', ch);
        letter.setAttribute('color', '#00ffff');
        letter.setAttribute('align', 'center');
        letter.setAttribute('position', `${x} 0 ${z}`);
        letter.setAttribute('rotation', `0 ${angle} 0`);
        letter.setAttribute('scale', '0.6 0.6 0.6');
        letter.setAttribute('shader', 'msdf');
        letter.setAttribute('font', 'https://cdn.aframe.io/fonts/Roboto-msdf.json');
        letter.setAttribute('opacity', '0.85');
        letter.setAttribute('side', 'double');
        ring.appendChild(letter);
      }
      ring.setAttribute('animation',{property:'rotation',to:'0 360 0',loop:true,dur:30000,easing:'linear'});
    </script>
  </a-entity>

  <!-- MUKTO CUBE -->
  <a-box position="-1 1 -3" rotation="0 45 0" color="#ff0a45" src="#boxTexture"
         animation__mouseenter="property: scale; to: 5.3 5.3 5.3; dur: 300; startEvents: mouseenter"
         animation__mouseleave="property: scale; to: 1 1 1; dur: 300; startEvents: mouseleave"
         static-body></a-box>

  <!-- SCENE BASE & SKY -->
  <a-cylinder id="ground" src="#groundTexture" radius="100" height="0.1" static-body></a-cylinder>
  <a-sky id="background" src="#skyTexture" radius="100"></a-sky>
  <a-sky src="#skyTexture0" radius="200"></a-sky>
  <a-sky src="#skyTexture1" radius="500"></a-sky>
  <a-sky src="#skyTexture2" radius="1000"></a-sky>
  <a-sky color="#00aabb" radius="2000"></a-sky>

  <!-- CAMERA & CURSOR -->
  <a-camera id="camera" look-controls="pointerLockEnabled: true">
    <a-cursor hover-color="#FAFAFA" active-color="#FF0000" color="#00ffff"></a-cursor>
  </a-camera>

  <!-- PARTICLES & LIGHT -->
  <a-entity id="particles" particle-system="preset: snow"></a-entity>
  <a-entity light="type: ambient; intensity: 0.5;"></a-entity>

  <!-- 3D SCAFFOLDING GALLERY -->
  <a-entity id="gallery"></a-entity>
  <script>
    const galleryImages = [
      {src:"assets/original-3743ff23b01ec3c79d77c427ef685987.png", url:"https://behance.net/dmkto"},
      {src:"https://cdn.dribbble.com/userupload/10753052/file/original-882c377e90e8711075bf0a29928ff2a0.png", url:""},
      {src:"assets/original-f3047bd2e40cc447074695b1b6bf880d.png", url:"https://dribbble.com/dmkto"},
      {src:"assets/original-901f295283dbfd83577cc91fccaf650a.jpg", url:""},
      {src:"assets/original-aea20384f5940ce206474c3b63a5bacd.png", url:""},
      {src:"assets/4135123a679bb5150e9d6334d27505ce.png", url:""},
      {src:"assets/original-c76478d833017f6d0c52568f53c13407.png", url:""},
      {src:"assets/2f87efc0141aea0b41250f876f2d128b.png", url:""}
    ];
    const gallery = document.querySelector('#gallery');
    const radius = 15;
    galleryImages.forEach((img,i)=>{
      const angle = i * (360 / galleryImages.length);
      const rad = angle * Math.PI/180;
      const x = Math.sin(rad) * radius;
      const z = Math.cos(rad) * radius;
      const scaffoldHeight = 6;
      const scaffold = document.createElement('a-box');
      scaffold.setAttribute('position', `${x} ${scaffoldHeight/2} ${z}`);
      scaffold.setAttribute('depth', 0.5);
      scaffold.setAttribute('width', 1.5);
      scaffold.setAttribute('height', scaffoldHeight);
      scaffold.setAttribute('color', '#888');
      scaffold.setAttribute('rotation', `0 ${-angle} 0`);
      gallery.appendChild(scaffold);

      const aimg = document.createElement('a-image');
      aimg.setAttribute('src', img.src);
      aimg.setAttribute('height', 4);
      aimg.setAttribute('width', 6);
      aimg.setAttribute('position', `${x} ${scaffoldHeight + 2} ${z}`);
      aimg.setAttribute('rotation', `0 ${-angle} 0`);
      if(img.url) aimg.setAttribute('onclick', `window.open('${img.url}')`);
      gallery.appendChild(aimg);
    });
  </script>

  <!-- JUMP WITH COOLDOWN -->
  <script>
    let canJump = true;
    const playerEl = document.querySelector('#player');
    const jumpVelocity = 5;

    AFRAME.registerComponent('jump-controls', {
      init: function() {
        const el = this.el;
        window.addEventListener('keydown', (e)=>{
          if(e.code==='Space' && canJump){
            canJump = false;
            const body = el.body;
            if(body) body.velocity.y = jumpVelocity;
            setTimeout(()=>{canJump = true;}, 600);
          }
        });
      }
    });
  </script>

</a-scene>
</body>
</html>
